[project]
name = "cs2-demo-backend"
version = "0.1.0"
description = "CS2 demo viewer + AI analysis — backend (Phase 1: standalone parser)"
requires-python = ">=3.11"

# Pinned to the versions verified by introspection in Phase 1. The parser code
# in scripts/parse_demo.py depends on demoparser2's exact API surface, so bumping
# these requires re-introspecting before trusting the field names.
dependencies = [
    "demoparser2==0.41.4",
    "awpy==2.0.2",
    "pandas>=2.0",
    # Phase 4: match analysis. Pinned major; the Messages API surface we use
    # (messages.create, system cache_control, usage token fields) is stable.
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # demoparser2 ships no stubs
