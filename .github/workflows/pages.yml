# Deploys the Phase 2 offline viewer to GitHub Pages as a PREVIEW.
#
# This is NOT the production deployment — the real product runs on a single VPS
# under docker compose (see CLAUDE.md, hard constraint #1). Pages just lets you
# eyeball the static viewer in a browser without running it locally.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Then this runs on every push to the branch below.
name: Deploy viewer to Pages

on:
  push:
    branches: ["claude/cs2-demo-viewer-ai-cl05ah"]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # NOTE: Pages must be enabled ONCE by hand first — repo Settings -> Pages
      # -> Source: "GitHub Actions". The workflow token cannot create the Pages
      # site itself ("Resource not accessible by integration"), so we don't try.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (base path = /<repo>/)
        # VITE_BASE must match the repo name so assets resolve on Pages.
        run: VITE_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
